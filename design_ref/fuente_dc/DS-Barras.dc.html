<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Barras de vida y marcos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#46e3c1}a:hover{color:#9af0dc}
.scene{background:#26331f url(/_blob/1f61c24b0ff951de145522a42f77e8ab) center/cover no-repeat}
.num{font-variant-numeric:tabular-nums}
.sh{text-shadow:0 1px 3px rgba(0,0,0,0.95)}
.caps{font-size:11px;font-weight:600;letter-spacing:0.14em;color:#9aa6ae;text-transform:uppercase}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 4px;border-radius:5px;background:#18242b;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.14);font-size:11px;font-weight:700;color:#dbe4ea;box-sizing:border-box;line-height:1}
.card{background:#0d1216;border-radius:18px;box-shadow:0 0 0 1px rgba(255,255,255,0.07),0 20px 50px rgba(0,0,0,0.45)}
.sub{background:#121a20;border-radius:12px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;background:#18242b;font-size:13px;color:#c3ccd3;box-sizing:border-box;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:10px;border:0;background:#18242b;color:#eef2f4;font-family:inherit;font-size:14px;font-weight:600;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.08)}
.sw{position:relative;width:34px;height:20px;border-radius:10px;flex:none}
.sw::after{content:"";position:absolute;top:3px;width:14px;height:14px;border-radius:50%;background:#ffffff}
.sw.on::after{right:3px}.sw.off::after{left:3px;background:#9aa6ae}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 810px; overflow: hidden; font-family: 'Barlow Semi Condensed', Inter, system-ui, sans-serif; color: #eef2f4; background: #070a0c">
<div style="position: absolute; inset: 0; background: #0b0f13"></div>
<div style="position: absolute; left: 40px; top: 30px; display: flex; flex-direction: column; gap: 4px"><span class="caps" style="color: {{accent}}">Sistema de diseño</span><span style="font-size: 30px; font-weight: 700">Barras de vida y marcos</span><span style="font-size: 14px; color: #9aa6ae">Color = quién es · lado de la insignia = amigo o amenaza · borde = qué le pasa · marco = rango</span></div>
<div style="position: absolute; left: 40px; right: 40px; top: 130px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<div class="card" style="padding: 18px; display: flex; flex-direction: column; gap: 11px; height: 650px; box-sizing: border-box">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px; font-weight: 700">{{g.t}}</span><span style="font-size: 12px; color: #9aa6ae">{{g.d}}</span></div>
<sc-for list="{{g.items}}" as="p" hint-placeholder-count="7">
<div style="display: flex; align-items: center; gap: 12px">
<div style="width: 250px; display: flex; flex-direction: column; gap: 3px; flex: none">
<span style="font-size: 12px; font-weight: 700; color: {{p.nc}}; text-align: {{p.al}}; padding: 0 30px">{{p.name}}</span>
<div style="display: flex; align-items: center; gap: 4px">
<span style="order: {{p.ord}}; width: 26px; height: 26px; border-radius: {{p.br}}; background: {{p.bb}}; border: {{p.bbd}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: {{p.bc}}; flex: none"><svg width="{{p.is}}" height="{{p.is}}" viewBox="0 0 24 24" fill="none" stroke="{{p.bc}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{p.icon}}"></path></svg>{{p.lv}}</span>
<div style="order: 1; flex: 1; position: relative; height: 16px; border-radius: 5px; background: #070a0c; border: {{p.bd}}; box-shadow: {{p.glow}}; overflow: hidden; box-sizing: border-box"><div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{p.pct}}%; background: {{p.fill}}"></div><div style="position: absolute; left: {{p.pct}}%; top: 0; bottom: 0; width: {{p.sh}}%; background: #e8edf0"></div><div style="position: absolute; inset: 0; background-image: repeating-linear-gradient(90deg, transparent 0 19px, rgba(0,0,0,0.55) 19px 20px)"></div></div>
</div>
</div>
<span style="font-size: 12px; line-height: 16px; color: #c3ccd3">{{p.note}}</span>
</div>
</sc-for>
</div>
</sc-for>
</div>

</div>
</x-dc>
