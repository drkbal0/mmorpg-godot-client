<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Insignia de El Nido</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#46e3c1}a:hover{color:#9af0dc}
.scene{background:#26331f url(/_blob/1f61c24b0ff951de145522a42f77e8ab) center/cover no-repeat}
.num{font-variant-numeric:tabular-nums}
.sh{text-shadow:0 1px 3px rgba(0,0,0,0.95)}
.caps{font-size:11px;font-weight:600;letter-spacing:0.14em;color:#9aa6ae;text-transform:uppercase}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 4px;border-radius:5px;background:#18242b;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.14);font-size:11px;font-weight:700;color:#dbe4ea;box-sizing:border-box;line-height:1}
.card{background:#0d1216;border-radius:18px;box-shadow:0 0 0 1px rgba(255,255,255,0.07),0 20px 50px rgba(0,0,0,0.45)}
.sub{background:#121a20;border-radius:12px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;background:#18242b;font-size:13px;color:#c3ccd3;box-sizing:border-box;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:10px;border:0;background:#18242b;color:#eef2f4;font-family:inherit;font-size:14px;font-weight:600;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.08)}
.sw{position:relative;width:34px;height:20px;border-radius:10px;flex:none}
.sw::after{content:"";position:absolute;top:3px;width:14px;height:14px;border-radius:50%;background:#ffffff}
.sw.on::after{right:3px}.sw.off::after{left:3px;background:#9aa6ae}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 810px; overflow: hidden; font-family: 'Barlow Semi Condensed', Inter, system-ui, sans-serif; color: #eef2f4; background: #070a0c">

<div style="position: absolute; inset: 0; background: #0b0f13"></div>
<div style="position: absolute; left: 60px; top: 44px; display: flex; flex-direction: column; gap: 6px">
<span class="caps" style="color: {{accent}}">Marca propia del modo Refugio</span>
<span style="font-size: 44px; font-weight: 700; letter-spacing: 0.14em; line-height: 1">EL NIDO</span>
<span style="font-size: 16px; color: #9aa6ae">Tu depa en la vecindad · una casa entre universos, vista en corte lateral</span>
</div>
<div style="position: absolute; left: 60px; top: 200px; display: flex; align-items: flex-end; gap: 44px">
<sc-for list="{{marks}}" as="m" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
<div style="width: {{m.box}}px; height: {{m.box}}px; border-radius: {{m.rad}}px; background: {{m.bg}}; display: flex; align-items: center; justify-content: center">
<svg width="{{m.size}}" height="{{m.size}}" viewBox="0 0 200 200" role="img" aria-label="Insignia de El Nido">
<circle cx="100" cy="100" r="92" fill="none" stroke="{{m.ring}}" stroke-width="5"></circle>
<circle cx="100" cy="100" r="82" fill="none" stroke="{{m.ring}}" stroke-opacity="0.25" stroke-width="2"></circle>
<rect x="124" y="58" width="5" height="20" fill="{{m.grass}}"></rect><circle cx="126" cy="54" r="12" fill="{{m.grass}}"></circle>
<ellipse cx="72" cy="60" rx="9" ry="6" fill="{{m.moth}}" transform="rotate(-20 72 60)"></ellipse><ellipse cx="86" cy="60" rx="9" ry="6" fill="{{m.moth}}" transform="rotate(20 86 60)"></ellipse>
<rect x="50" y="76" width="100" height="9" rx="4.5" fill="{{m.grass}}"></rect>
<path d="M52 86h96l-10 26-20 22-18 30-18-30-20-22z" fill="{{m.rock}}" stroke="{{m.ring}}" stroke-width="3" stroke-linejoin="round"></path>
<g fill="{{m.win}}"><rect x="68" y="93" width="16" height="11" rx="2"></rect><rect x="92" y="93" width="16" height="11" rx="2"></rect><rect x="116" y="93" width="16" height="11" rx="2"></rect><rect x="80" y="111" width="16" height="11" rx="2"></rect><rect x="104" y="111" width="16" height="11" rx="2"></rect><rect x="92" y="129" width="16" height="11" rx="2"></rect></g>
<path d="M100 168l8 9-8 13-8-13z" fill="{{m.ring}}"></path>
</svg>
</div>
<span style="font-size: 13px; color: #9aa6ae">{{m.label}}</span>
</div>
</sc-for>
</div>
<div style="position: absolute; left: 60px; right: 60px; top: 600px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px">
<sc-for list="{{uses}}" as="u" hint-placeholder-count="4">
<div class="card" style="padding: 16px; border-radius: 14px; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 15px; font-weight: 700">{{u.t}}</span><span style="font-size: 13px; line-height: 18px; color: #c3ccd3">{{u.d}}</span></div>
</sc-for>
</div>
<div style="position: absolute; right: 60px; top: 60px; display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 999px; box-shadow: inset 0 0 0 1.5px {{accent}}">
<svg width="22" height="22" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="none" stroke="{{accent}}" stroke-width="3"></circle><path d="M10 17h28l-5 10-6 4-3 9-3-9-6-4z" fill="{{accent}}"></path></svg>
<span style="font-size: 14px; font-weight: 600">Sello de artesano: «Hecho en el Nido de Kael»</span>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"acento":{"editor":"color","default":"#46e3c1","options":["#46e3c1","#5aa9ff","#f5b546","#ff6fa8"]},"$preview":{"width":1440,"height":810}}'>
class Component extends DCLogic {
renderVals() {
const A = this.props.acento ?? '#46e3c1';
const TI = {
user: 'M12 4a4 4 0 1 0 0 8a4 4 0 1 0 0-8M4 21c1-5 4-7 8-7s7 2 8 7', star: 'M12 2l2.5 7.5H22l-6 4.5 2.5 7.5-6.5-4.5-6.5 4.5 2.5-7.5-6-4.5h7.5z',
book: 'M4 5c3-1 6-1 8 1 2-2 5-2 8-1v14c-3-1-6-1-8 1-2-2-5-2-8-1zM12 6v14', map: 'M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2zM9 4v14M15 6v14',
users: 'M9 11a3 3 0 1 0 0-6a3 3 0 1 0 0 6M3 20c0-3 3-5 6-5s6 2 6 5M17 11a3 3 0 1 0 0-6M21 20c0-3-2-4-4-5', layout: 'M4 4h16v16H4zM4 15h16M10 15v5', home: 'M3 11l9-7 9 7M5 10v10h14V10M10 20v-6h4v6', bag: 'M6 8h12l-1 12H7zM9 8a3 3 0 0 1 6 0', scroll: 'M6 4h11a2 2 0 0 1 0 4H8v12H5a2 2 0 0 1 0-4h3M11 12h5M11 16h5', orbs: 'M12 9a3 3 0 1 0 0-6a3 3 0 1 0 0 6M6 21a3 3 0 1 0 0-6a3 3 0 1 0 0 6M18 21a3 3 0 1 0 0-6a3 3 0 1 0 0 6M10 8l-3 8M14 8l3 8M9 18h6'
};
const tabs = [['Equipo', 'C', TI.user], ['Poderes', 'N', TI.orbs], ['Misiones', 'L', TI.scroll], ['Mapa', 'M', TI.map], ['Códice', 'J', TI.book], ['Social', 'O', TI.users], ['Refugio', 'H', TI.home], ['Comercio', 'P', TI.bag]]
.map(([label, k, icon]) => ({ label, k, icon, color: label === 'BARE' ? '#eef2f4' : '#9aa6ae', bar: label === 'BARE' ? A : 'transparent' }));
const mk = (label, size, box, rad, bg, mono) => ({ label, size, box, rad, bg, ring: mono ? '#eef2f4' : A, rock: mono ? 'none' : '#1c2a33', win: mono ? '#eef2f4' : '#f5c35b', grass: mono ? '#eef2f4' : '#7fcf5a', moth: mono ? '#eef2f4' : '#f5b546' });
const extra = {
marks: [
mk('Insignia principal', 320, 340, 24, 'transparent'), mk('Icono de la app', 132, 168, 38, '#141a21'),
mk('Una tinta', 132, 168, 24, 'transparent', true), mk('Menú y HUD · 48 px', 48, 72, 16, '#141a21')
],
uses: [
{ t: 'Qué cuenta', d: 'La isla flotante con sus salas encendidas, el cristal que la ancla, el árbol de la superficie y las alas de Pispa.' },
{ t: 'Dónde aparece', d: 'Launcher, pestaña Refugio del Menú, pantalla de carga del refugio, icono de la app y avisos del móvil.' },
{ t: 'Sello de artesano', d: 'Lo que fabricas en tu refugio lleva tu sello en el tooltip. Otros jugadores ven quién lo hizo.' },
{ t: 'Color', d: 'El anillo y el cristal usan el acento del universo de tu personaje. Las ventanas siempre en dorado.' }
]
};

return Object.assign({ accent: A, tabs }, extra);
}
}
</script>
</body>
</html>
