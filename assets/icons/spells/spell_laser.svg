<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="laserGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="80%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="20" fill="#070d14"/>
  <circle cx="64" cy="64" r="54" fill="url(#laserGlow)" opacity="0.6"/>
  <!-- Focus Rings -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="64" cy="64" r="28" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <!-- Laser Beam -->
  <line x1="20" y1="108" x2="108" y2="20" stroke="url(#beam)" stroke-width="8" stroke-linecap="round"/>
  <line x1="20" y1="108" x2="108" y2="20" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <!-- Crosshair Reticle -->
  <line x1="64" y1="16" x2="64" y2="34" stroke="#7dd3fc" stroke-width="3"/>
  <line x1="64" y1="94" x2="64" y2="112" stroke="#7dd3fc" stroke-width="3"/>
  <line x1="16" y1="64" x2="34" y2="64" stroke="#7dd3fc" stroke-width="3"/>
  <line x1="94" y1="64" x2="112" y2="64" stroke="#7dd3fc" stroke-width="3"/>
  <!-- Core Spark -->
  <circle cx="64" cy="64" r="5" fill="#ffffff"/>
</svg>
